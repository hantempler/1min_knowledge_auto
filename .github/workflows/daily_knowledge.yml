name: 1Min Knowledge Generator

on:
  workflow_dispatch:
    inputs:
      slot:
        description: '실행 슬롯 (auto: KST 시간대 자동감지, morning: 오전 지식 브리핑, evening: 오후 지식 브리핑)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
  repository_dispatch:
    types: [trigger-1min-knowledge, trigger-1min-morning, trigger-1min-evening]

concurrency:
  group: knowledge-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Fast via uv)
        run: |
          python -m pip install --upgrade pip uv
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

      - name: Verify FFmpeg
        run: |
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Setup Google Cloud Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          mkdir -p config
          echo "$GCP_CREDENTIALS" > config/application_default_credentials.json

      - name: Setup API Keys
        run: |
          mkdir -p config
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" > config/.env
          echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}" >> config/.env

      - name: Setup YouTube Token
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p config
          echo "$YOUTUBE_TOKEN" > config/youtube_token.json


      - name: Run Pipeline
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 50
          command: |
            echo "Executing 1Min Knowledge Pipeline"
            SLOT_CHOICE="${{ github.event.inputs.slot || github.event.client_payload.slot || 'auto' }}"
            echo "Target slot: $SLOT_CHOICE"
            python src/main.py --slot "$SLOT_CHOICE"

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-output-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/**/*.json
            data/**/*.log
            data/**/final_shorts.mp4
            data/**/4_audio.mp3

      - name: Commit back topic history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json
          git diff --cached --quiet || git commit -m "chore: update used_topics [skip ci]"
          git pull --rebase origin main || true
          git push origin main || echo "push skipped (no changes or conflict)"
